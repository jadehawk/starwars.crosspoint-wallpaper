name: Release Wallpaper Packs

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate all collections and matching release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/wallpaper_pack_tool.py validate --root . --tag "$RELEASE_TAG"
      - name: Package one install-only ZIP per collection
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/wallpaper_pack_tool.py pack-all --root . --output-dir dist --tag "$RELEASE_TAG"
      - name: Create a release containing separate device-specific ZIPs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.crosspoint-wallpaper.zip --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md --verify-tag
